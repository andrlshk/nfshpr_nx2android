        function exportSingleHudButton(btnId, format) {
            let found = null;
            for (const cat of hudAtlasCategories) {
                const match = cat.buttons.find(b => b.id === btnId);
                if (match) { found = match; break; }
            }
            if (!found) return;

            const svgCode = renderHudButtonSvg(found.icon, 128);
            if (format === 'svg') {
                const blob = new Blob([svgCode], { type: 'image/svg+xml;charset=utf-8' });
                triggerDownload(blob, `nfshp_hud_${found.id}.svg`);
                showFacetedToast('SVG сохранён', `nfshp_hud_${found.id}.svg`, 'scpd');
                return;
            }

            const svgBlob = new Blob([svgCode], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = 128;
                c.height = 128;
                c.getContext('2d').drawImage(img, 0, 0, 128, 128);
                URL.revokeObjectURL(url);
                c.toBlob(pngBlob => {
                    if (pngBlob) {
                        triggerDownload(pngBlob, `nfshp_hud_${found.id}.png`);
                        showFacetedToast('PNG сохранён', `${found.name} • 128×128`, 'racer');
                    }
                }, 'image/png');
            };
            img.src = url;
        }

        function exportFullAtlasPng() {
            const allButtons = hudAtlasCategories.flatMap(c => c.buttons);
            const cols = 8;
            const cell = 128;
            const rows = Math.ceil(allButtons.length / cols);
            const width = cols * cell;
            const height = rows * cell;

            const nodes = allButtons.map((b, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = col * cell + 16;
                const y = row * cell + 16;
                const inner = renderHudButtonSvg(b.icon, 96)
                    .replace(/<svg[^>]*>/, '')
                    .replace('</svg>', '');
                return `<g transform="translate(${x}, ${y})">${inner}</g>`;
            }).join('\n');

            const sheetSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${nodes}</svg>`;
            const blob = new Blob([sheetSvg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = width;
                c.height = height;
                c.getContext('2d').drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(url);
                c.toBlob(pngBlob => {
                    if (pngBlob) {
                        triggerDownload(pngBlob, `nfshp_hud_atlas_${allButtons.length}.png`);
                        showFacetedToast('Атлас PNG сохранён', `${allButtons.length} кнопок • ${width}×${height}`, 'confirm');
                    }
                }, 'image/png');
            };
            img.src = url;
        }

        function triggerDownload(blob, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        }

        // =========================================================================
        // 12. ИНТЕРАКТИВНЫЕ ОБРАБОТЧИКИ НАВИГАЦИИ, НАСТРОЕК И DRAG & DROP
        // =========================================================================
        let launchTimers = [];
        let activeDrag = null;
        let navTransitionTimer = null;

        function setViewMode(mode) {
            if (state.viewMode === mode) return;
            state.viewMode = mode;
            state.animateScreen = true;
            renderApp();
            state.animateScreen = false;
        }

        function transitionToScreen(targetScreen) {
            if (state.currentScreen === targetScreen) return;
            if (navTransitionTimer) {
                clearTimeout(navTransitionTimer);
                navTransitionTimer = null;
            }
            const activeLayer = document.querySelector('#workspaceContainer .device-screen > .relative.z-10, #workspaceContainer .device-screen');
            if (activeLayer) {
                activeLayer.classList.add('hp-screen-exit');
            }
            navTransitionTimer = setTimeout(() => {
                navTransitionTimer = null;
                state.currentScreen = targetScreen;
                state.animateScreen = true;
                renderApp();
                state.animateScreen = false;
            }, 135);
        }

        function navigateTo(screen) {
            if (state.viewMode === 'collage') {
                state.currentScreen = screen;
                const idxMap = { main: 0, controls: 1, graphics: 2, hud: 3 };
                const frames = document.querySelectorAll('#workspaceContainer .device-frame');
                const target = frames[idxMap[screen]];
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    target.style.boxShadow = '0 0 0 2px #0072e5, 0 28px 70px -14px rgba(0,0,0,0.88)';
                    setTimeout(() => { target.style.boxShadow = ''; }, 900);
                }
                return;
            }
            transitionToScreen(screen);
        }

        function openSingleFromCollage(screen) {
            state.currentScreen = screen;
            state.viewMode = 'single';
            state.animateScreen = true;
            renderApp();
            state.animateScreen = false;
        }

        function startGameLaunch() {
            syncToAndroid();
            if (typeof AndroidBridge !== 'undefined' && AndroidBridge.launchGame) {
                const res = AndroidBridge.launchGame(buildEnvText(), buildSettingsText(), buildUiJson());
                if (res !== 'ok') {
                    showFacetedToast('Error', res.replace('err:', ''), 'racer');
                }
                return;
            }
            launchTimers.forEach(t => clearTimeout(t));
            launchTimers = [];
            state.isLaunching = true;
            state.launchPercent = 20;
            state.launchStage = t('launchStep1');
            renderApp();

            const steps = [
                { delay: 400,  pct: 55, text: t('launchStep2').replace('{res}', state.graphics.resolution) },
                { delay: 850,  pct: 85, text: t('launchStep3') },
                { delay: 1300, pct: 100, text: t('launchStep4') }
            ];

            steps.forEach(s => {
                launchTimers.push(setTimeout(() => {
                    if (!state.isLaunching) return;
                    state.launchPercent = s.pct;
                    state.launchStage = s.text;
                    renderApp();
                }, s.delay));
            });

            launchTimers.push(setTimeout(() => {
                if (!state.isLaunching) return;
                showFacetedToast(t('toastVulkanReady'), getTelemetrySummary(), 'racer');
            }, 1600));
        }

        function cancelLaunch() {
            launchTimers.forEach(t => clearTimeout(t));
            launchTimers = [];
            state.isLaunching = false;
            renderApp();
        }

        function loadBackgroundFromFile(file, sourceLabel = '') {
            if (!file || !file.type || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = e => {
                state.customBgUrl = e.target.result;
                document.getElementById('btnResetCustomBg').classList.remove('hidden');
                renderApp();
                showFacetedToast('Фон обновлён', sourceLabel || file.name || 'Изображение', 'scpd');
            };
            reader.readAsDataURL(file);
        }

        function handleCustomBgUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            loadBackgroundFromFile(file, file.name);
        }

        function resetCustomBg() {
            state.customBgUrl = null;
            document.getElementById('bgUploadInput').value = '';
            document.getElementById('btnResetCustomBg').classList.add('hidden');
            renderApp();
            showFacetedToast('Фон сброшен', 'Стандартный тёмный фон', 'scpd');
        }

        // Поддержка вставки скриншота из буфера обмена (Ctrl+V / Cmd+V)
        window.addEventListener('paste', event => {
            const items = event.clipboardData && event.clipboardData.items;
            if (!items) return;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.startsWith('image/')) {
                    const file = items[i].getAsFile();
                    if (file) {
                        event.preventDefault();
                        loadBackgroundFromFile(file, 'Вставлено из буфера (Ctrl+V)');
                        break;
                    }
                }
            }
        });

        // Поддержка перетаскивания изображения в окно (Drag & Drop)
        let dragCounter = 0;
        window.addEventListener('dragenter', event => {
            if (event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files')) {
                dragCounter++;
                const overlay = document.getElementById('globalDropOverlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }
        });

        window.addEventListener('dragover', event => {
            if (event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files')) {
                event.preventDefault();
            }
        });

        window.addEventListener('dragleave', () => {
            dragCounter = Math.max(0, dragCounter - 1);
            if (dragCounter === 0) {
                const overlay = document.getElementById('globalDropOverlay');
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }
        });

        window.addEventListener('drop', event => {
            dragCounter = 0;
            const overlay = document.getElementById('globalDropOverlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');

            const files = event.dataTransfer && event.dataTransfer.files;
            if (files && files.length > 0) {
                const imgFile = Array.from(files).find(f => f.type.startsWith('image/'));
                if (imgFile) {
                    event.preventDefault();
                    loadBackgroundFromFile(imgFile, imgFile.name);
                }
            }
        });

        // Плавное обновление ползунков без сброса фокуса
        function updateSliderLive(key, rawVal) {
            const val = Number(rawVal);
            if (key === 'deadzone') {
                state.controls.deadzone = val;
                document.querySelectorAll('[data-val-deadzone]').forEach(el => el.textContent = `${val}%`);
            } else if (key === 'sensitivity') {
                state.controls.sensitivity = val;
                document.querySelectorAll('[data-val-sensitivity]').forEach(el => el.textContent = `${val}%`);
            } else if (key === 'hudOpacity') {
                state.controls.hudOpacity = val;
                document.querySelectorAll('[data-val-hudOpacity]').forEach(el => el.textContent = `${val}%`);
                document.querySelectorAll('.hud-node').forEach(node => {
                    node.style.opacity = Math.max(0.2, val / 100);
                });
            } else if (key === 'hudSize') {
                state.controls.hudSize = val;
                document.querySelectorAll('[data-val-hudSize]').forEach(el => el.textContent = `${val}%`);
                refreshAllHudNodeSizes();
            } else if (key === 'fsrSharpness') {
                state.graphics.fsrSharpness = val;
                document.querySelectorAll('[data-val-fsrSharpness]').forEach(el => el.textContent = (val / 100).toFixed(1));
            }
        }

        function refreshAllHudNodeSizes() {
            const maps = [state.controls.raceLayout, state.controls.menuLayout];
            maps.forEach(mapObj => {
                Object.values(mapObj).forEach(btn => {
                    const px = computeHudNodePx(btn);
                    document.querySelectorAll(`[data-hud-node="${btn.id}"]`).forEach(node => {
                        node.style.width = `${px}px`;
                        node.style.height = `${px}px`;
                    });
                });
            });
        }

        function updateSingleHudScale(rawVal) {
            const pct = Number(rawVal);
            const mapObj = getActiveHudMap();
            const btn = mapObj[state.selectedHudId];
            if (!btn) return;
            btn.scale = pct / 100;
            document.querySelectorAll('[data-hud-active-pct]').forEach(el => el.textContent = `${pct}%`);
            document.querySelectorAll('[data-hud-coords]').forEach(el => {
                el.textContent = `${getHudNodeLabel(btn)} • X:${btn.x}% Y:${btn.y}% • ${pct}%`;
            });
            const px = computeHudNodePx(btn);
            document.querySelectorAll(`[data-hud-node="${btn.id}"]`).forEach(node => {
                node.style.width = `${px}px`;
                node.style.height = `${px}px`;
            });
        }

        // Сеттеры вкладки УПРАВЛЕНИЕ
        function setControlDevice(v) { state.controls.device = v; renderApp(); }
        function setControlSteering(v) { state.controls.steering = v; renderApp(); }
        function setControlAutoGas(v) { state.controls.autoGas = (v === 'on'); renderApp(); }
        function setControlVibration(v) { state.controls.vibration = (v === 'on'); renderApp(); }

        // Сеттеры вкладки ГРАФИКА
        function setGfxGmem(v) { state.graphics.gmem = (v === 'on'); state.graphics.autoProfile = false; renderApp(); }
        function setGfxResolution(v) { state.graphics.resolution = v; renderApp(); }
        function setGfxFsr(v) { state.graphics.fsr = v; renderApp(); }
        function setGfxFps(v) { state.graphics.fpsLimit = v; renderApp(); }
        function setGfxShadows(v) { state.graphics.shadows = v; renderApp(); }
        function setGfxAniso(v) { state.graphics.anisotropic = v; renderApp(); }
        function setGfxAA(v) { state.graphics.aa = v; renderApp(); }
        function setGfxReflections(v) { state.graphics.reflections = v; renderApp(); }
        function setGfxDistance(v) { state.graphics.drawDistance = v; renderApp(); }
        function setGfxVulkan(v) { state.graphics.autoProfile = false; state.graphics.vulkanDriver = v; renderApp(); }
        function setGfxShaderCache(v) { state.graphics.shaderCache = (v === 'on'); renderApp(); }
        function setGfxDmVkNocull(v) { state.graphics.dmVkNocull = (v === 'on'); renderApp(); }

        // Редактор HUD
        function setHudPreset(preset) {
            state.hudPreset = preset;
            state.selectedHudId = preset === 'menu' ? 'actA' : 'gas';
            renderApp();
        }

        function resetHudLayout() {
            if (state.hudPreset === 'menu') {
                state.controls.menuLayout = JSON.parse(JSON.stringify(defaultGarageMenuLayout));
            } else {
                state.controls.raceLayout = JSON.parse(JSON.stringify(defaultRaceLayout));
            }
            renderApp();
            showFacetedToast(t('toastLayoutReset'), t('toastLayoutResetSub'), 'scpd');
        }

        function toggleAtlasDrawer(force) {
            state.showAtlasDrawer = typeof force === 'boolean' ? force : !state.showAtlasDrawer;
            renderApp();
        }

        // Drag & Drop для кнопок HUD
        function startHudDrag(event, btnId) {
            if (event.cancelable) event.preventDefault();
            const zone = event.currentTarget.closest('.hud-dropzone');
            if (!zone) return;
            const rect = zone.getBoundingClientRect();
            state.selectedHudId = btnId;
            activeDrag = { btnId, rect };
            const mapObj = getActiveHudMap();
            const btn = mapObj[btnId];
            if (btn) {
                document.querySelectorAll('[data-hud-coords]').forEach(el => {
                    el.textContent = `${getHudNodeLabel(btn)} • X:${btn.x}% Y:${btn.y}%`;
                });
            }
        }

        function handleHudDragMove(event) {
            if (!activeDrag) return;
            if (event.cancelable) event.preventDefault();
            const cx = event.touches ? event.touches[0].clientX : event.clientX;
            const cy = event.touches ? event.touches[0].clientY : event.clientY;
            const { btnId, rect } = activeDrag;

            let x = Math.round(((cx - rect.left) / rect.width) * 100);
            let y = Math.round(((cy - rect.top) / rect.height) * 100);
            x = Math.max(6, Math.min(94, x));
            y = Math.max(12, Math.min(86, y));

            const mapObj = getActiveHudMap();
            const btn = mapObj[btnId];
            if (btn) {
                btn.x = x;
                btn.y = y;
                document.querySelectorAll(`[data-hud-node="${btnId}"]`).forEach(el => {
                    el.style.left = `${x}%`;
                    el.style.top = `${y}%`;
                });
                document.querySelectorAll('[data-hud-coords]').forEach(el => {
                    el.textContent = `${getHudNodeLabel(btn)} • X:${x}% Y:${y}%`;
                });
            }
        }

        function stopHudDrag() {
            if (activeDrag) {
                activeDrag = null;
                renderApp();
            }
        }

        window.addEventListener('mousemove', handleHudDragMove);
        window.addEventListener('touchmove', handleHudDragMove, { passive: false });
        window.addEventListener('mouseup', stopHudDrag);
        window.addEventListener('touchend', stopHudDrag);
        window.addEventListener('touchcancel', stopHudDrag);
        window.addEventListener('resize', refreshAllHudNodeSizes);

        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (state.isLaunching) cancelLaunch();
                if (state.showAtlasDrawer) toggleAtlasDrawer(false);
                toggleLogModal(false);
            }
        });

        // Тактильный spring-отклик при касании пальцем на мобильных устройствах (Android / iOS)
        document.addEventListener('touchstart', e => {
            const btn = e.target.closest('button, a, .hp-telemetry-pill');
            if (btn) {
                btn.classList.add('is-touching');
                if (navigator.vibrate) {
                    try { navigator.vibrate(8); } catch (_) {}
                }
            }
        }, { passive: true });

        ['touchend', 'touchcancel'].forEach(evt => {
            document.addEventListener(evt, () => {
                document.querySelectorAll('.is-touching').forEach(el => el.classList.remove('is-touching'));
            }, { passive: true });
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadFromAndroid();
            state.animateScreen = false;
            renderApp();
            state.animateScreen = false;
        });
    </script>
</body>
</html>
